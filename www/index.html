<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Homie</title>
    <!--
      Página de respaldo de la app nativa (Capacitor, modo URL remota).
      Solo se muestra si el WebView no logra cargar el sitio en vivo.
      Intenta redirigir automáticamente y ofrece un botón de reintento.
    -->
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #111827; color: #f9fafb;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
      body { display: flex; align-items: center; justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
      main { text-align: center; max-width: 320px; }
      .logo { width: 72px; height: 72px; border-radius: 20px; background: #EF9F27; margin: 0 auto 20px;
        display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 34px; color: #111827; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; color: #9ca3af; margin: 0 0 24px; line-height: 1.5; }
      button { width: 100%; padding: 14px; border: 0; border-radius: 16px; background: #EF9F27;
        color: #111827; font-weight: 700; font-size: 15px; }
      .spin { width: 22px; height: 22px; border: 3px solid #374151; border-top-color: #EF9F27;
        border-radius: 50%; margin: 0 auto 16px; animation: s 0.9s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">H</div>
      <div class="spin" id="spin"></div>
      <h1>Conectando con Homie…</h1>
      <p id="msg">Si tardas en entrar, revisa tu conexión a internet e inténtalo de nuevo.</p>
      <button id="btn" type="button">Reintentar</button>
    </main>
    <script>
      (function () {
        var URL_APP = "https://task-match-me.lovable.app/";
        function ir() { window.location.replace(URL_APP); }
        document.getElementById("btn").addEventListener("click", ir);
        window.addEventListener("online", ir);
        if (navigator.onLine !== false) setTimeout(ir, 800);
        else document.getElementById("msg").textContent = "Sin conexión. Conéctate a internet y toca Reintentar.";
      })();
    </script>
  </body>
</html>
